<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-labelledby="title desc">
  <title id="title">Melodius — free music streaming on web, Android and Windows</title>
  <desc id="desc">Free, ad-free music streaming with live Jams, Smart Shuffle, Blends and Music DNA listening stats. Available on the web, Google Play and the Microsoft Store, with library and history synced across devices.</desc>
  <style>
    .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
    .sweep{animation:sweep 8s linear infinite}
    @keyframes sweep{to{stroke-dashoffset:-100}}
    .eq{transform-box:fill-box;transform-origin:center;animation:eq 1.1s ease-in-out infinite alternate}
    .e2{animation-duration:.8s;animation-delay:-.3s}.e3{animation-duration:1.3s;animation-delay:-.6s}.e4{animation-duration:.9s;animation-delay:-.2s}.e5{animation-duration:1.2s;animation-delay:-.5s}
    @keyframes eq{from{transform:scaleY(.35)}to{transform:scaleY(1)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#140C22"/>
      <stop offset=".5" stop-color="#0A0D13"/>
      <stop offset="1" stop-color="#0A0D13"/>
    </linearGradient>
    <linearGradient id="app" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#45178A"/>
      <stop offset="1" stop-color="#B44CF5"/>
    </linearGradient>
    <radialGradient id="halo" cx="80" cy="60" r="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9B3BEA" stop-opacity=".2"/>
      <stop offset="1" stop-color="#9B3BEA" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x=".5" y=".5" width="899" height="319" rx="19.5" fill="url(#bg)" stroke="#2A2340"/>
  <rect width="900" height="320" rx="20" fill="url(#halo)"/>
  <rect class="sweep" x="1" y="1" width="898" height="318" rx="19" fill="none" stroke="#B44CF5" stroke-opacity=".8" stroke-width="1.5" pathLength="100" stroke-dasharray="7 93"/>

  <g class="sans">
    <g>
      <rect x="56" y="40" width="48" height="48" rx="13" fill="url(#app)"/>
      <rect x="56.5" y="40.5" width="47" height="47" rx="12.5" fill="none" stroke="#fff" stroke-opacity=".18"/>
      <g fill="#fff">
        <rect class="eq" x="64" y="58" width="4" height="12" rx="2"/>
        <rect class="eq e2" x="71" y="53" width="4" height="22" rx="2"/>
        <rect class="eq e3" x="78" y="50" width="4" height="28" rx="2"/>
        <rect class="eq e4" x="85" y="55" width="4" height="18" rx="2"/>
        <rect class="eq e5" x="92" y="59" width="4" height="10" rx="2"/>
      </g>
      <text x="120" y="66" font-size="30" font-weight="700" fill="#F0F6FC">Melodius</text>
      <text x="120" y="92" font-size="15" fill="#8B949E">Free music streaming — discovery, live Jams &amp; listening stats</text>
      <rect x="712" y="42" width="132" height="28" rx="14" fill="#B44CF5" fill-opacity=".1" stroke="#B44CF5" stroke-opacity=".4"/>
      <text x="778" y="60.5" font-size="13" font-weight="600" text-anchor="middle" fill="#D8B4FE">Free · No ads</text>
    </g>

    <path d="M56 124H844" stroke="#1F1A2E"/>
    <path d="M250 150v72M450 150v72M650 150v72" stroke="#1F1A2E"/>

    <g>
      <text x="56" y="174" font-size="22" font-weight="700" fill="#F0F6FC">Live Jams</text>
      <text x="56" y="200" font-size="13" fill="#8B949E">Listen together in sync,</text>
      <text x="56" y="218" font-size="13" fill="#8B949E">shared queue &amp; skip votes</text>
    </g>
    <g>
      <text x="276" y="174" font-size="22" font-weight="700" fill="#F0F6FC">Smart Shuffle</text>
      <text x="276" y="200" font-size="13" fill="#8B949E">Re-seeds from the track</text>
      <text x="276" y="218" font-size="13" fill="#8B949E">that’s playing right now</text>
    </g>
    <g>
      <text x="476" y="174" font-size="22" font-weight="700" fill="#F0F6FC">Blends</text>
      <text x="476" y="200" font-size="13" fill="#8B949E">Two listeners’ tastes,</text>
      <text x="476" y="218" font-size="13" fill="#8B949E">one shared playlist</text>
    </g>
    <g>
      <text x="676" y="174" font-size="22" font-weight="700" fill="#F0F6FC">Music DNA</text>
      <text x="676" y="200" font-size="13" fill="#8B949E">Genres, heatmaps &amp; how</text>
      <text x="676" y="218" font-size="13" fill="#8B949E">your taste evolves</text>
    </g>

    <g>
      <text x="56" y="273" font-size="11" font-weight="600" letter-spacing="1.6" fill="#8B949E">AVAILABLE ON</text>
      <g font-size="13" fill="#C9D1D9">
        <rect x="160" y="254" width="72" height="30" rx="15" fill="#11161F" stroke="#2A2340"/>
        <g transform="translate(173 262)" fill="none" stroke="#C4B5FD" stroke-width="1.2">
          <circle cx="7" cy="7" r="6.2"/><ellipse cx="7" cy="7" rx="2.8" ry="6.2"/><path d="M.8 7h12.4"/>
        </g>
        <text x="194" y="273.5">Web</text>
        <rect x="242" y="254" width="100" height="30" rx="15" fill="#11161F" stroke="#2A2340"/>
        <path transform="translate(255 262) scale(.5833)" fill="#3DDC84" d="M18.4395 5.5586c-.675 1.1664-1.352 2.3318-2.0274 3.498-.0366-.0155-.0742-.0286-.1113-.043-1.8249-.6957-3.484-.8-4.42-.787-1.8551.0185-3.3544.4643-4.2597.8203-.084-.1494-1.7526-3.021-2.0215-3.4864a1.1451 1.1451 0 0 0-.1406-.1914c-.3312-.364-.9054-.4859-1.379-.203-.475.282-.7136.9361-.3886 1.5019 1.9466 3.3696-.0966-.2158 1.9473 3.3593.0172.031-.4946.2642-1.3926 1.0177C2.8987 12.176.452 14.772 0 18.9902h24c-.119-1.1108-.3686-2.099-.7461-3.0683-.7438-1.9118-1.8435-3.2928-2.7402-4.1836a12.1048 12.1048 0 0 0-2.1309-1.6875c.6594-1.122 1.312-2.2559 1.9649-3.3848.2077-.3615.1886-.7956-.0079-1.1191a1.1001 1.1001 0 0 0-.8515-.5332c-.5225-.0536-.9392.3128-1.0488.5449zm-.0391 8.461c.3944.5926.324 1.3306-.1563 1.6503-.4799.3197-1.188.0985-1.582-.4941-.3944-.5927-.324-1.3307.1563-1.6504.4727-.315 1.1812-.1086 1.582.4941zM7.207 13.5273c.4803.3197.5506 1.0577.1563 1.6504-.394.5926-1.1038.8138-1.584.4941-.48-.3197-.5503-1.0577-.1563-1.6504.4008-.6021 1.1087-.8106 1.584-.4941z"/>
        <text x="276" y="273.5">Android</text>
        <rect x="352" y="254" width="104" height="30" rx="15" fill="#11161F" stroke="#2A2340"/>
        <g transform="translate(365 262)" fill="#00A4EF">
          <rect width="6.5" height="6.5"/><rect x="7.5" width="6.5" height="6.5"/><rect y="7.5" width="6.5" height="6.5"/><rect x="7.5" y="7.5" width="6.5" height="6.5"/>
        </g>
        <text x="387" y="273.5">Windows</text>
      </g>
      <text x="844" y="273.5" font-size="13" fill="#8B949E" text-anchor="end">Library, playlists &amp; history synced everywhere</text>
    </g>
  </g>
</svg>

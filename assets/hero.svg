<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="title desc">
  <title id="title">Kumar Manas — Backend Developer · Automation Enthusiast</title>
  <desc id="desc">Building Krypton, a Discord security bot for 50K+ servers, and Melodius, a free music streaming platform.</desc>
  <style>
    .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
    .orb{animation:drift 18s ease-in-out infinite alternate}
    .orb.alt{animation-duration:23s;animation-direction:alternate-reverse}
    @keyframes drift{to{transform:translate(70px,26px)}}
    .rise{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
    .d1{animation-delay:.1s}.d2{animation-delay:.25s}.d3{animation-delay:.4s}.d4{animation-delay:.55s}
    @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
    .line{opacity:0;animation:cycle 12s 1s infinite both}
    .line.first{opacity:1}
    .line.second{animation-delay:5s}
    .line.third{animation-delay:9s}
    @keyframes cycle{0%{opacity:0;transform:translateY(8px)}4%,29%{opacity:1;transform:none}33.3%,100%{opacity:0;transform:translateY(-8px)}}
    .caret{animation:blink 1.1s steps(1) infinite}
    @keyframes blink{50%{fill-opacity:0}}
    .glow{transform-box:fill-box;transform-origin:center;animation:pulse 3.6s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:.75;transform:scale(1.25)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <defs>
    <clipPath id="card"><rect width="900" height="300" rx="20"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E1220"/>
      <stop offset="1" stop-color="#0A0D13"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C4B5FD"/>
      <stop offset=".55" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#5EEAD4"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C5CFF"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="ring" x1="-140" y1="0" x2="140" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C5CFF" stop-opacity=".9"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity=".9"/>
    </linearGradient>
    <radialGradient id="core" cx=".35" cy=".35" r=".8">
      <stop offset="0" stop-color="#C4B5FD"/>
      <stop offset=".6" stop-color="#7C5CFF"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </radialGradient>
    <radialGradient id="fade" cx="740" cy="150" r="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <mask id="gridMask"><rect width="900" height="300" fill="url(#fade)"/></mask>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#fff" fill-opacity=".09"/>
    </pattern>
    <filter id="blur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
    <filter id="soft" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <g clip-path="url(#card)">
    <rect width="900" height="300" fill="url(#bg)"/>
    <circle class="orb" cx="170" cy="40" r="150" fill="#7C5CFF" fill-opacity=".32" filter="url(#blur)"/>
    <circle class="orb alt" cx="780" cy="270" r="150" fill="#2DD4BF" fill-opacity=".2" filter="url(#blur)"/>
    <rect width="900" height="300" fill="url(#dots)" mask="url(#gridMask)"/>

    <g transform="translate(740 150) rotate(-18)">
      <ellipse rx="62" ry="23" fill="none" stroke="url(#ring)" stroke-opacity=".55"/>
      <ellipse rx="98" ry="37" fill="none" stroke="url(#ring)" stroke-opacity=".35"/>
      <ellipse rx="132" ry="50" fill="none" stroke="url(#ring)" stroke-opacity=".2" stroke-dasharray="3 6"/>
      <circle class="glow" r="34" fill="#7C5CFF" filter="url(#soft)"/>
      <circle r="21" fill="url(#core)"/>
      <circle r="21" fill="none" stroke="#fff" stroke-opacity=".25"/>
      <circle r="4.5" fill="#5EEAD4">
        <animateMotion dur="7s" repeatCount="indefinite" path="M-62 0a62 23 0 1 0 124 0a62 23 0 1 0-124 0"/>
      </circle>
      <circle r="3.5" fill="#C4B5FD">
        <animateMotion dur="12s" repeatCount="indefinite" path="M98 0a98 37 0 1 0-196 0a98 37 0 1 0 196 0"/>
      </circle>
      <circle r="3.5" fill="#5EEAD4" fill-opacity=".8">
        <animateMotion dur="12s" begin="-6s" repeatCount="indefinite" path="M98 0a98 37 0 1 0-196 0a98 37 0 1 0 196 0"/>
      </circle>
      <circle r="3" fill="#A78BFA">
        <animateMotion dur="19s" repeatCount="indefinite" path="M-132 0a132 50 0 1 0 264 0a132 50 0 1 0-264 0"/>
      </circle>
    </g>

    <g class="sans">
      <text class="rise d1" x="56" y="84" font-size="13" font-weight="600" letter-spacing="3.2" fill="#8B949E">HELLO, I’M</text>
      <text class="rise d2" x="53" y="146" font-size="60" font-weight="700" letter-spacing="-1" fill="url(#name)">Kumar Manas</text>
      <text class="rise d3" x="56" y="186" font-size="21" fill="#C9D1D9">Backend Developer · Automation Enthusiast</text>
      <rect class="rise d4" x="56" y="208" width="56" height="3" rx="1.5" fill="url(#accent)"/>
    </g>

    <g class="mono" font-size="16" fill="#C9D1D9">
      <text class="line first" x="56" y="254"><tspan fill="#2DD4BF">$</tspan> building Krypton — security for 50K+ Discord servers<tspan class="caret" fill="#A78BFA">▌</tspan></text>
      <text class="line second" x="56" y="254"><tspan fill="#2DD4BF">$</tspan> shipping Melodius — free, ad-free music streaming<tspan class="caret" fill="#A78BFA">▌</tspan></text>
      <text class="line third" x="56" y="254"><tspan fill="#2DD4BF">$</tspan> if it’s repetitive, it’s automated.<tspan class="caret" fill="#A78BFA">▌</tspan></text>
    </g>
  </g>
  <rect x=".5" y=".5" width="899" height="299" rx="19.5" fill="none" stroke="#fff" stroke-opacity=".08"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-labelledby="title desc">
  <title id="title">Krypton — all-in-one Discord security bot</title>
  <desc id="desc">50K+ Discord servers, 12M+ users, 400+ commands across 20 modules. Anti-nuke, anti-raid, automod, tickets, music, giveaways, logging and welcomer.</desc>
  <style>
    .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
    .sweep{animation:sweep 8s linear infinite}
    @keyframes sweep{to{stroke-dashoffset:-100}}
    .scan{animation:scan 2.8s ease-in-out infinite}
    @keyframes scan{0%{transform:translateY(-4px);opacity:0}15%,85%{opacity:1}100%{transform:translateY(52px);opacity:0}}
    .live{transform-box:fill-box;transform-origin:center;animation:live 2s ease-out infinite}
    @keyframes live{0%{transform:scale(1);opacity:.7}100%{transform:scale(3);opacity:0}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.scan,.live{display:none}}
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C1414"/>
      <stop offset=".5" stop-color="#0A0D13"/>
      <stop offset="1" stop-color="#0A0D13"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E68A" stop-opacity="0"/>
      <stop offset=".5" stop-color="#00E68A"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00E68A" stop-opacity=".28"/>
      <stop offset="1" stop-color="#00E68A" stop-opacity=".04"/>
    </linearGradient>
    <radialGradient id="halo" cx="80" cy="60" r="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00E68A" stop-opacity=".16"/>
      <stop offset="1" stop-color="#00E68A" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="shieldClip"><path d="M22 0 44 8v17c0 13.5-9.4 22.6-22 26C9.4 47.6 0 38.5 0 25V8Z"/></clipPath>
  </defs>

  <rect x=".5" y=".5" width="899" height="319" rx="19.5" fill="url(#bg)" stroke="#232A36"/>
  <rect width="900" height="320" rx="20" fill="url(#halo)"/>
  <rect class="sweep" x="1" y="1" width="898" height="318" rx="19" fill="none" stroke="#00E68A" stroke-opacity=".75" stroke-width="1.5" pathLength="100" stroke-dasharray="7 93"/>

  <g class="sans">
    <g>
      <g transform="translate(56 42)">
        <path d="M22 0 44 8v17c0 13.5-9.4 22.6-22 26C9.4 47.6 0 38.5 0 25V8Z" fill="url(#shield)" stroke="#00E68A" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="m13.5 25.5 6 6 11.5-12.5" fill="none" stroke="#00E68A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <g clip-path="url(#shieldClip)">
          <rect class="scan" x="0" y="0" width="44" height="2" fill="#7CFFC4" fill-opacity=".8"/>
        </g>
      </g>
      <text x="116" y="66" font-size="30" font-weight="700" fill="#F0F6FC">Krypton</text>
      <text x="116" y="92" font-size="15" fill="#8B949E">All-in-one Discord security bot — anti-nuke, moderation, tickets &amp; music</text>
      <rect x="712" y="42" width="132" height="28" rx="14" fill="#00E68A" fill-opacity=".08" stroke="#00E68A" stroke-opacity=".35"/>
      <circle class="live" cx="731" cy="56" r="4" fill="#00E68A"/>
      <circle cx="731" cy="56" r="4" fill="#00E68A"/>
      <text x="788" y="60.5" font-size="13" font-weight="600" text-anchor="middle" fill="#7CFFC4">In production</text>
    </g>

    <path d="M56 124H844" stroke="#1C2230"/>
    <path d="M250 150v66M450 150v66M650 150v66" stroke="#1C2230"/>

    <g>
      <text x="56" y="190" font-size="46" font-weight="700" fill="#F0F6FC">50K<tspan fill="#00E68A">+</tspan></text>
      <text x="58" y="218" font-size="12" font-weight="600" letter-spacing="2" fill="#8B949E">DISCORD SERVERS</text>
    </g>
    <g>
      <text x="276" y="190" font-size="46" font-weight="700" fill="#F0F6FC">12M<tspan fill="#00E68A">+</tspan></text>
      <text x="278" y="218" font-size="12" font-weight="600" letter-spacing="2" fill="#8B949E">USERS</text>
    </g>
    <g>
      <text x="476" y="190" font-size="46" font-weight="700" fill="#F0F6FC">400<tspan fill="#00E68A">+</tspan></text>
      <text x="478" y="218" font-size="12" font-weight="600" letter-spacing="2" fill="#8B949E">COMMANDS</text>
    </g>
    <g>
      <text x="676" y="190" font-size="46" font-weight="700" fill="#F0F6FC">20</text>
      <text x="678" y="218" font-size="12" font-weight="600" letter-spacing="2" fill="#8B949E">MODULES</text>
    </g>

    <g font-size="13" fill="#C9D1D9" text-anchor="middle">
      <rect x="56" y="250" width="97" height="30" rx="15" fill="#11161F" stroke="#232A36"/><text x="104.5" y="269.5">Anti-Nuke</text>
      <rect x="163" y="250" width="97" height="30" rx="15" fill="#11161F" stroke="#232A36"/><text x="211.5" y="269.5">Anti-Raid</text>
      <rect x="270" y="250" width="82" height="30" rx="15" fill="#11161F" stroke="#232A36"/><text x="311" y="269.5">AutoMod</text>
      <rect x="362" y="250" width="82" height="30" rx="15" fill="#11161F" stroke="#232A36"/><text x="403" y="269.5">Tickets</text>
      <rect x="454" y="250" width="67" height="30" rx="15" fill="#11161F" stroke="#232A36"/><text x="487.5" y="269.5">Music</text>
      <rect x="531" y="250" width="97" height="30" rx="15" fill="#11161F" stroke="#232A36"/><text x="579.5" y="269.5">Giveaways</text>
      <rect x="638" y="250" width="82" height="30" rx="15" fill="#11161F" stroke="#232A36"/><text x="679" y="269.5">Logging</text>
      <rect x="730" y="250" width="89" height="30" rx="15" fill="#11161F" stroke="#232A36"/><text x="774.5" y="269.5">Welcomer</text>
    </g>
  </g>
</svg>
